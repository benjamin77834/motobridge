name: MotoBridge
options:
  bundleIdPrefix: com.motobridge
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "48V68SFH7Q"   # Apple Developer Program (cuenta de pago)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad (para probar el bridge por red)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "10"

packages:
  Opus:
    url: https://github.com/alta/swift-opus.git
    branch: main

targets:
  MotoBridge:
    type: application
    platform: iOS
    sources:
      - path: MotoBridge
    dependencies:
      # Watch desactivado temporalmente (problema de firma con cuenta personal).
      # Para reactivar: descomentar y descomentar el target MotoBridgeWatch abajo.
      # - target: MotoBridgeWatch
      #   embed: true
      - package: Opus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motobridge.app.monkeyfon
        INFOPLIST_FILE: MotoBridge/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Watch desactivado temporalmente (firma con cuenta personal). Reactivar
  # descomentando este target y la dependencia en MotoBridge.
  # MotoBridgeWatch:
  #   type: application
  #   platform: watchOS
  #   sources:
  #     - path: MotoBridgeWatch
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: com.motobridge.app.watchkitapp
  #       GENERATE_INFOPLIST_FILE: YES
  #       INFOPLIST_KEY_WKApplication: YES
  #       INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.motobridge.app
  #       INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  #       TARGETED_DEVICE_FAMILY: "4"
  #       ENABLE_PREVIEWS: YES

  # Nodo de malla para macOS: repetidor + radar (sin audio ni sensores).
  # Reutiliza MeshRelay y VoiceChannel del core de iOS (Foundation puro).
  MonoBridgeRelay:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MonoBridgeRelay
      - path: MotoBridge/Core/Network/MeshRelay.swift
      - path: MotoBridge/Core/Network/VoiceChannel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motobridge.relay.monkeyfon
        PRODUCT_NAME: "Mono Bridge Relay"
        INFOPLIST_FILE: MonoBridgeRelay/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MonoBridgeRelay/MonoBridgeRelay.entitlements
        ENABLE_PREVIEWS: YES

  MotoBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MotoBridgeTests
    dependencies:
      - target: MotoBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motobridge.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MotoBridge:
    build:
      targets:
        MotoBridge: all
        MotoBridgeTests: [test]
    test:
      targets:
        - MotoBridgeTests
  MonoBridgeRelay:
    build:
      targets:
        MonoBridgeRelay: all
