name: MotoBridge
options:
  bundleIdPrefix: com.motobridge
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad (para probar el bridge por red)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Opus:
    url: https://github.com/alta/swift-opus.git
    branch: main

targets:
  MotoBridge:
    type: application
    platform: iOS
    sources:
      - path: MotoBridge
    dependencies:
      - target: MotoBridgeWatch
        embed: true
      - package: Opus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motobridge.app
        INFOPLIST_FILE: MotoBridge/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MotoBridgeWatch:
    type: application
    platform: watchOS
    sources:
      - path: MotoBridgeWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motobridge.app.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.motobridge.app
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "4" # Apple Watch
        ENABLE_PREVIEWS: YES

  MotoBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MotoBridgeTests
    dependencies:
      - target: MotoBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motobridge.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MotoBridge:
    build:
      targets:
        MotoBridge: all
        MotoBridgeTests: [test]
    test:
      targets:
        - MotoBridgeTests
